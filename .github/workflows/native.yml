name: Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: C++ distance kernels
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Test
        run: ctest --test-dir native/build --output-on-failure

      - name: Install Python benchmark dependencies
        run: python -m pip install numpy

      - name: Run native benchmark smoke
        run: >
          python tools/native_distance_benchmark.py
          --no-build
          --build-dir native/build
          --rows 512
          --queries 4
          --dim 64
          --iterations 2
          --json-out native/build/native-distance-kernels.json
          --markdown-out native/build/native-distance-kernels.md
          --svg-out native/build/native-distance-kernels.svg
